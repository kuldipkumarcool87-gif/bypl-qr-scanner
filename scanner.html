```html
<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

  <title>BYPL QR Scanner</title>

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>

  <style>

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      padding:15px;
      background:#0f172a;
      color:#fff;
      font-family:Arial,Helvetica,sans-serif;
      min-height:100vh;
    }

    .container{
      max-width:500px;
      margin:auto;
      background:#1e293b;
      border-radius:18px;
      padding:18px;
      box-shadow:0 15px 40px rgba(0,0,0,.35);
    }

    h2{
      text-align:center;
      margin:5px 0 18px;
    }

    #reader{
      width:100%;
      background:#000;
      border-radius:12px;
      overflow:hidden;
      min-height:300px;
    }

    .status{
      margin-top:15px;
      padding:12px;
      border-radius:10px;
      background:#334155;
      text-align:center;
      font-size:14px;
      line-height:1.5;
    }

    .btn{
      width:100%;
      margin-top:15px;
      padding:13px;
      border:0;
      border-radius:10px;
      font-weight:800;
      cursor:pointer;
      font-size:15px;
    }

    .close{
      background:#dc2626;
      color:#fff;
    }

    .return{
      background:#2563eb;
      color:#fff;
    }

  </style>

</head>


<body>

<div class="container">

  <h2>
    📷 BYPL QR Scanner
  </h2>

  <div id="reader"></div>

  <div
    id="status"
    class="status">

    Camera starting...

  </div>


  <button
    id="returnBtn"
    class="btn return"
    style="display:none;"
    onclick="returnToInspection()">

    ← Return to Inspection

  </button>


  <button
    class="btn close"
    onclick="closeScanner()">

    ✕ Close Scanner

  </button>

</div>


<script>

  const params =
    new URLSearchParams(
      window.location.search
    );


  /*
   * Apps Script parent origin.
   */

  const targetOrigin =
    params.get('origin') ||
    '*';


  let qrScanner =
    null;


  let scanCompleted =
    false;


  function updateStatus(
    message
  ){

    const status =
      document.getElementById(
        'status'
      );


    if(status){

      status.textContent =
        message;

    }

  }


  function sendQRToParent(
    qrValue
  ){

    if(scanCompleted){
      return;
    }


    scanCompleted =
      true;


    updateStatus(
      '✓ QR scanned successfully. Sending data...'
    );


    if(
      window.opener &&
      !window.opener.closed
    ){

      try{

        window.opener.postMessage(
          {
            type:'BYPL_QR_SCANNED',
            qr:String(qrValue)
          },
          targetOrigin
        );

      }catch(error){

        console.error(
          error
        );

      }


      /*
       * Give parent time to receive message.
       */

      setTimeout(
        function(){

          try{

            window.close();

          }catch(e){}


          /*
           * If browser refuses window.close(),
           * show return button.
           */

          setTimeout(
            function(){

              document
                .getElementById(
                  'returnBtn'
                )
                .style.display =
                'block';

              updateStatus(
                'QR sent successfully. You can return to the inspection screen.'
              );

            },
            500
          );

        },
        800
      );

    }else{

      updateStatus(
        'Main inspection window not found. Please return to the inspection page manually.'
      );


      document
        .getElementById(
          'returnBtn'
        )
        .style.display =
        'block';

    }

  }


  function onScanSuccess(
    decodedText
  ){

    if(!decodedText){
      return;
    }


    sendQRToParent(
      String(decodedText)
    );


    if(qrScanner){

      qrScanner
        .stop()
        .then(
          function(){

            try{

              qrScanner.clear();

            }catch(e){}

          }
        )
        .catch(
          function(error){

            console.log(
              'Scanner stop:',
              error
            );

          }
        );

    }

  }


  function onScanFailure(
    error
  ){

    /*
     * Continuous scan failures are normal.
     * Do not display them to user.
     */

  }


  function startScanner(){

    updateStatus(
      'Requesting camera permission...'
    );


    if(
      typeof Html5Qrcode ===
      'undefined'
    ){

      updateStatus(
        'QR scanner library could not be loaded. Check internet connection.'
      );

      return;

    }


    qrScanner =
      new Html5Qrcode(
        'reader'
      );


    qrScanner
      .start(

        {
          facingMode:{
            ideal:'environment'
          }
        },

        {
          fps:10,

          qrbox:{
            width:250,
            height:250
          },

          aspectRatio:1.0

        },

        onScanSuccess,

        onScanFailure

      )

      .then(
        function(){

          updateStatus(
            '✓ Camera started. QR code को camera के सामने रखें.'
          );

        }
      )

      .catch(
        function(error){

          console.error(
            'Camera error:',
            error
          );


          updateStatus(
            'Camera start नहीं हो पाया. Browser में Camera permission Allow करें और इस page को HTTPS पर खोलें.'
          );


          document
            .getElementById(
              'returnBtn'
            )
            .style.display =
            'block';

        }
      );

  }


  function stopScanner(){

    if(!qrScanner){
      return Promise.resolve();
    }


    return qrScanner
      .stop()
      .catch(
        function(){}
      )
      .then(
        function(){

          try{

            qrScanner.clear();

          }catch(e){}

        }
      );

  }


  function closeScanner(){

    stopScanner()
      .then(
        function(){

          /*
           * First attempt to close popup.
           */

          try{

            window.close();

          }catch(e){}


          /*
           * Mobile browsers may refuse
           * window.close().
           *
           * Therefore show fallback.
           */

          setTimeout(
            function(){

              document
                .getElementById(
                  'returnBtn'
                )
                .style.display =
                'block';

              updateStatus(
                'Browser ने tab को automatically close नहीं किया. ऊपर/previous tab पर वापस जाएँ.'
              );

            },
            500
          );

        }
      );

  }


  function returnToInspection(){

    /*
     * If this page was opened as popup,
     * try closing it.
     */

    try{

      window.close();

    }catch(e){}


    /*
     * If close is blocked,
     * go back if possible.
     */

    setTimeout(
      function(){

        if(
          window.history.length >
          1
        ){

          window.history.back();

        }

      },
      300
    );

  }


  window.addEventListener(
    'load',
    function(){

      startScanner();

    }
  );

</script>

</body>
</html>
```
